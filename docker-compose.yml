version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fatigue_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: fatigue_logs
    ports:
      - "5433:5432"  # Sadece bu satırı değiştirdik
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: